version: 2
updates:
  - package-ecosystem: npm
    directory: /Editor
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 breaks vue-tsc (the type checker for .vue files) until it supports it.
      # Remove this when a vue-tsc release says it works with TypeScript 7, then upgrade both together.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /Designer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 breaks vue-tsc (the type checker for .vue files) until it supports it.
      # Remove this when a vue-tsc release says it works with TypeScript 7, then upgrade both together.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /App
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
